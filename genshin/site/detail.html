<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色数值 · 原神数值建模</title>
<link rel="stylesheet" href="assets/genshin.css?v=20261110">
<style>
  .layout { display: flex; gap: 24px; padding: 0 28px 40px; flex-wrap: wrap; }
  .col { flex: 1; min-width: 380px; }
  h2.sec { font-size: 15px; color: #d3bc8e; margin: 18px 0 8px; border-bottom: 1px solid #2c3850; padding-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { color: #7c8aa0; font-weight: 500; text-align: left; padding: 4px 8px; border-bottom: 1px solid #2c3850; }
  td { padding: 3px 8px; border-bottom: 1px solid #1c2436; }
  tr:hover td { background: #1c2436; }
  td.num { font-variant-numeric: tabular-nums; color: #b8c4d8; }
  .profile { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; padding: 12px 28px; }
  .profile .avatar { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; align-self: center; background: #232c40; }
  .profile h1 { font-size: 22px; color: #e8e2d0; }
  .profile .meta { color: #d3bc8e; font-size: 13px; }
  canvas { background: #1c2436; border: 1px solid #2c3850; border-radius: 6px; width: 100%; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #9aa7bd; padding: 4px 2px; }
  .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
  a.back { position: absolute; right: 28px; top: 30px; color: #7c8aa0; font-size: 13px; text-decoration: none; }
  .calc-box { font-size: 13px; }
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 14px; margin-bottom: 12px; }
  .calc-grid label { display: flex; flex-direction: column; gap: 3px; color: #7c8aa0; font-size: 12.5px; }
  .calc-grid label[hidden] { display: none; } /* display:flex 会盖过 [hidden] 的浏览器默认 display:none，需显式压回 */
  .calc-grid input, .calc-grid select {
    background: #1c2436; border: 1px solid #2c3850; color: #d8dee9;
    padding: 5px 8px; border-radius: 4px; font-size: 13px; width: 100%;
  }
  #calcOut table { margin-bottom: 10px; }
  #calcOut .num { font-variant-numeric: tabular-nums; }
  /* 说明类文字提亮：暗灰 #5a6a80 在深底上对比度仅约 3:1，难以阅读 */
  #calcMeta, #hoyo_status { color: #b8c4d8; font-size: 13px; line-height: 1.6; }
  /* 伤害数字来源浮窗：悬停计算表数字显示完整乘区来源 */
  #calcTip {
    position: fixed; display: none; z-index: 99; max-width: 460px;
    background: #101624; border: 1px solid #2c3850; border-radius: 6px;
    color: #b8c4d8; font-size: 12.5px; line-height: 1.75;
    padding: 8px 12px; white-space: pre-line; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.5); font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header class="gs-head">
  <h1>角色数值</h1>
  <a class="back" href="./">‹ 返回角色列表</a>
</header>
<div class="profile" id="profile">加载中…</div>

<div class="layout">
  <div class="col">
    <details class="fold" open>
      <summary>武器收益对比（Lv90 · 含武器被动）</summary>
      <p class="meta" id="weaponHint" hidden></p>
      <div id="weaponChartWrap">
        <canvas id="weaponChart" width="760" height="320"></canvas>
        <p class="meta" id="weaponNote" style="font-size:12px; color:#b8c4d8; line-height:1.6; margin:6px 2px 0;"></p>
      </div>
    </details>
  </div>

  <div class="col">
    <details class="fold" open>
      <summary>伤害计算（标准公式）</summary>
      <div class="calc-box">
        <p class="meta" id="hoyo_status" hidden></p>
        <div class="calc-grid">
          <label>倍率基于<select id="c_scaling"><option value="atk">攻击力</option><option value="hp">生命值上限</option><option value="def">防御力</option></select></label>
          <label>面板攻击力<input id="c_atk" type="number" value="2000"></label>
          <label>面板生命上限<input id="c_hp" type="number" value="30000"></label>
          <label>面板防御力<input id="c_def" type="number" value="900"></label>
          <label>暴击率 %<input id="c_cr" type="number" value="50" step="0.1"></label>
          <label>暴击伤害 %<input id="c_cd" type="number" value="100" step="1"></label>
          <label>元素伤害加成 %<input id="c_bonus" type="number" value="46.6" step="0.1"></label>
          <label>元素精通<input id="c_em" type="number" value="100"></label>
          <label id="c_amplify_wrap">增幅反应<select id="c_amplify"><option value="1">无</option><option value="1.5">蒸发 1.5×</option><option value="2">蒸发 2.0×</option><option value="1.5">融化 1.5×</option><option value="2">融化 2.0×</option></select></label>
          <label>角色等级<input id="c_charlv" type="number" value="90"></label>
          <label>敌人等级<input id="c_enelev" type="number" value="90"></label>
          <label>敌人抗性 %<input id="c_res" type="number" value="10"></label>
          <label id="c_records_wrap">极星辉域记录次数<input id="c_records" type="number" value="0" min="0" max="12"></label>
          <label id="c_starbonus_wrap">星反应增伤 %<input id="c_starbonus" type="number" value="0" step="0.1"></label>
          <label id="c_zhengsu_wrap" hidden>整肃层数<input id="c_zhengsu" type="number" value="0" min="0" max="6"></label>
          <label id="c_fulight_wrap" hidden>时隙浮光消耗<input id="c_fulight" type="number" value="70" min="70"></label>
          <label>天赋等级<input id="c_tlv" type="number" value="10" min="1" max="15"></label>
        </div>
        <div id="calcOut"></div>
        <p class="meta" id="calcMeta">公式：伤害 = 属性×倍率 × (1+加成) × 暴击区 × 增幅区 × 防御区 × 抗性区。精通增幅（蒸发/融化）= 2.78×元素精通÷(元素精通+1400)。增幅反应仅作用于元素伤害。</p>
      </div>
    </details>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const name = params.get('name') || 'HuTao';
let current = null; // 当前角色数据（伤害计算用）

async function boot() {
  const c = await (await fetch('/api/characters/' + encodeURIComponent(name))).json(); // 角色数据存 SQL Server genshin 库
  current = c;
  window.GS_PAGE_NAME = c.nameZh; // 留言浮窗自动附带角色名（feedback.js 读取）
  document.title = `${c.nameZh} · 角色数值`;
  document.getElementById('profile').innerHTML =
    `<img class="avatar" src="${c.icon}" alt="${c.nameZh}" onerror="this.replaceWith(Object.assign(document.createElement('div'), { className: 'avatar avatar-ph', textContent: (this.alt || '?').slice(0, 1), style: 'background:#4a5568' }))"><h1>${c.nameZh}</h1><span class="meta">${c.titleZh} · ${c.element} · ${c.weapon} · 实装版本 ${c.version} · 突破加成：${c.substatZh} · ${c.region || ''}</span>`;
  const fulightWrap = document.getElementById('c_fulight_wrap');
  if (fulightWrap) fulightWrap.hidden = c.name !== 'Zibai'; // 时隙浮光输入仅兹白（月转时隙机制）需要
  // 星系输入按角色机制精确显隐——无关角色藏入口，防残留输入干扰对账
  // （曾发生：薇斯纳场景的星反应增伤36%残留到桑多涅页，星超导虚高恰好36%）
  // 记录次数是星超导专属机制（星扩散反应系数恒为 1），仅对含星超导行的角色显示；
  // 星反应增伤对任意星系行生效（附加精通乘区），有星系行即显示
  const hasStarConduct = ['combat1', 'combat2', 'combat3'].some((k) =>
    (c.talents?.[k]?.labels || []).some((l) => /星超导/.test(l)));
  const hasStarAny = ['combat1', 'combat2', 'combat3'].some((k) =>
    (c.talents?.[k]?.labels || []).some((l) => /星超导|星扩散/.test(l)));
  document.getElementById('c_records_wrap').hidden = !hasStarConduct;
  document.getElementById('c_starbonus_wrap').hidden = !hasStarAny;
  // 整肃层数仅薇斯纳（仪典·春之行列：灵剑伤害 100%+层数×10%，至多 6 层）
  document.getElementById('c_zhengsu_wrap').hidden = c.name !== 'Vesna';
  // 增幅反应仅火/水/冰元素可触发（蒸发=水火、融化=火冰）；风/岩/雷/草的直伤永不蒸发/融化，藏入口防误导
  document.getElementById('c_amplify_wrap').hidden = !['火', '水', '冰'].includes(c.element);

  drawWeaponCompare();
}

// ===== 武器收益对比：面板缓存反推圣遗物贡献，同类型 3-5★ 逐把重组面板，代表输出行暴击排序 =====
// 武器 fx 工具：轮转类（蝶变式 w=lunN）互斥激活——按窗口枚举（非轮转部分 + 各轮转段），
// 每个窗口整面板+整行计算取最优；bonus 子键（all/normal/charge/skill/burst）按代表行攻击方式匹配——
// 星/月行不吃普通增伤（cfg.dmgBonus 不进其公式），行方式不匹配的增伤（如"重击伤害提升"对普攻行）也不注入
const fxSumArr = (arr, k, rowType) => arr.reduce((a, f) => {
  const dot = f.k.indexOf('.');
  const fk = dot < 0 ? f.k : f.k.slice(0, dot);
  const sub = dot < 0 ? null : f.k.slice(dot + 1);
  if (fk !== k) return a;
  if (fk === 'bonus' && sub && sub !== 'all' && sub !== rowType) return a;
  return a + f.v;
}, 0);
const fxWindows = (x) => {
  const fx = x.fx || [];
  const base = fx.filter((f) => !/^lun\d+$/.test(f.w || ''));
  const luns = fx.filter((f) => /^lun\d+$/.test(f.w || ''));
  if (!luns.length) return [fx];
  const groups = {};
  luns.forEach((f) => { const m = (f.w || '').match(/^lun(\d+)$/); const g = 'lun' + m[1]; (groups[g] = groups[g] || []).push(f); });
  return Object.keys(groups).sort().map((g) => base.concat(groups[g]));
};
const rowAttackType = (row) => row.name.includes('重击') ? 'charge'
  : row.name.includes('下坠') ? 'plunge'
  : row.key === 'combat2' ? 'skill' : row.key === 'combat3' ? 'burst' : 'normal';
let weaponsData = null;
let weaponBarRects = []; // 条形命中区域（武器图悬停/点击提示），随每次重绘更新
const weaponsReady = fetch('data/weapons.json').then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
  .then((j) => { weaponsData = j; })
  .catch(() => {});
weaponsReady.then(() => drawWeaponCompare());

// ===== 默认参考面板：未登录访客的基础数据源 =====
// 有游戏实测留言的角色用实测面板（去零头，武器为实测者佩戴）；其余按典型配装合成（西风系列基准武器 + 圣遗物模板）
const DEFAULT_PANELS = {
  '桑多涅': { weaponId: 12502, atk: 3121, hp: 18006, def: 1044, cr: 71, cd: 187, em: 19 }, // 留言板实测（狼的末路）
  '兹白': { weaponId: 11431, atk: 1022, hp: 18006, def: 3320, cr: 64, cd: 212, em: 120 }, // 留言板实测（息燧之笛）
  '薇斯纳': { weaponId: 11522, atk: 2902, hp: 18565, def: 733, cr: 64, cd: 244, em: 21 }, // 留言板实测（蝶变，86级面板）
};
const DEFAULT_WEAPON = { '单手剑': '11401', '双手剑': '12401', '长柄武器': '13407', '法器': '14401', '弓': '15401' }; // 西风系列：副词条充能不进伤害面板
function makeDefaultPanel(cur) {
  if (!weaponsData) return null;
  const stat = cur.stats[cur.stats.length - 1];
  const m = DEFAULT_PANELS[cur.nameZh];
  if (m) return { ...m, source: '实测玩家参考面板（留言板游戏实测，去零头）' };
  const wid = DEFAULT_WEAPON[cur.weapon];
  if (!wid || !weaponsData.items[wid]) return null;
  const wa = weaponsData.items[wid].a;
  return {
    weaponId: wid,
    atk: Math.round((stat.atk + wa) * 1.466), // 圣遗物模板：攻击% 46.6%
    hp: Math.round(stat.hp), def: Math.round(stat.def),
    cr: 36, cd: 112, em: 0, // 圣遗物模板：双暴 31.1/62.2（约 1:2）、精通 0
    source: '典型配装合成面板（西风系列武器 + 圣遗物模板）',
  };
}

// 突破副词条（substatZh）→ 反推属性映射（精通 sp 是点数、暴击率/暴伤 sp×100 是百分数）
const ASC_MAP = { '攻击力': 'atk%', '生命值': 'hp%', '防御力': 'def%', '暴击率': 'cr', '暴击伤害': 'cd', '元素精通': 'em' };

function drawWeaponCompare() {
  const hint = document.getElementById('weaponHint');
  const wrap = document.getElementById('weaponChartWrap');
  const fail = (msg) => { hint.textContent = msg; hint.hidden = false; wrap.style.display = 'none'; };
  if (!current) return;
  if (!weaponsData) { fail('武器数据加载失败，请刷新重试'); return; }
  const cache = (() => { try { return JSON.parse(localStorage.getItem('genshin_hoyo_panels') || 'null'); } catch { return null; } })();
  let p = cache && cache.chars && cache.chars[window.GS_PAGE_NAME];
  let usingDefault = false;
  if (!p) { // 未登录或缓存无当前角色：默认参考面板（实测去零头/典型配装合成）
    p = makeDefaultPanel(current);
    if (!p) { fail('默认参考面板生成失败（武器库加载中？请刷新重试）'); return; }
    usingDefault = true;
  } else if (p.level !== 90) { fail('面板角色等级非 90，暂不支持武器对比'); return; }
  // 当前武器解析：weaponId（Enka 数字）优先，weapon 中文名兜底；解析不到不猜
  let curId = null;
  if (p.weaponId && weaponsData.items[p.weaponId]) curId = String(p.weaponId);
  else if (p.weapon) {
    const hit = Object.entries(weaponsData.items).find(([, x]) => x.n === p.weapon);
    if (hit) curId = hit[0];
  }
  if (!curId) { fail('面板缓存的武器信息无法解析（当前武器：' + (p.weapon || p.weaponId || '未知') + '）'); return; }
  const curW = weaponsData.items[curId];
  // 缓存面板值是字符串（服务端 strconv 输出），统一数字化 P 防字符串拼接错值
  const P = { atk: parseFloat(p.atk), hp: parseFloat(p.hp), def: parseFloat(p.def), cr: parseFloat(p.cr), cd: parseFloat(p.cd), em: parseFloat(p.em) };
  const cand = Object.entries(weaponsData.items).filter(([, x]) => x.t === curW.t && x.r >= 3);
  if (!cand.length) { fail('同类型武器候选为空'); return; }

  const ctx = buildCfg();
  const cfg = ctx.cfg;
  const stat = current.stats[current.stats.length - 1]; // 90 级白字
  const substatZh = current.substatZh || '';
  const ascKey = ASC_MAP[substatZh];
  const ascPct = ascKey === 'atk%' || ascKey === 'hp%' || ascKey === 'def%' ? stat.sp : 0;
  const ascCr = substatZh === '暴击率' ? stat.sp * 100 : 0;
  const ascCd = substatZh === '暴击伤害' ? stat.sp * 100 : 0;
  const ascEm = substatZh === '元素精通' ? stat.sp : 0;
  const curSub = curW.s || [];
  const curFxBase = (curW.fx || []).filter((f) => !/^lun\d+$/.test(f.w || '')); // 反推 C：当前武器取非轮转部分（轮转口径不确定，由候选窗口枚举承担）
  const curSubKey = curSub[0], curSubV = curSub[1] || 0;
  // 反推圣遗物合流贡献 C（当前武器自身代入必得原面板——round-trip 恒等）
  const baseWhite = stat.atk + curW.a;
  const C_atk = P.atk - baseWhite * (1 + ascPct + (curSubKey === 'atk%' ? curSubV / 100 : 0) + fxSumArr(curFxBase, 'atk%') / 100);
  const C_cr = P.cr - 5 - ascCr - (curSubKey === 'cr' ? curSubV : 0) - fxSumArr(curFxBase, 'cr');
  const C_cd = P.cd - 50 - ascCd - (curSubKey === 'cd' ? curSubV : 0) - fxSumArr(curFxBase, 'cd');
  const C_em = P.em - ascEm - (curSubKey === 'em' ? curSubV : 0) - fxSumArr(curFxBase, 'em');

  const rows = buildRows(current, cfg.tlv);
  if (!rows.length) { fail('当前角色无可计算伤害行'); return; }
  // 代表输出行：原面板（缓存）下暴击最大的行——换武器只重算该行，保证比较同一行
  const cons = (window.hoyoPanelForPage || {}).constellation || 0;
  const evalCtx = { ...ctx, cons };
  // 缓存面板值是字符串（服务端 strconv 输出），必须数字化——字符串参与加法会拼接成错值
  const panel0 = { ...P };
  let repRow = null, repVal = -1;
  // 代表输出行：乘区体系角色（月曜/星曜）优先从本体系行中选（月曜角色主输出=月曜行、星曜角色=星系行），
  // 大数字直伤行（如大招多段）不应带偏代表行；无体系角色回退全行选最大
  const sys = systemOf(current);
  const pool = sys.lunarMult ? rows.filter((r) => r.isLunar)
    : sys.boost && !sys.lunarMult ? rows.filter((r) => r.isStar) : rows;
  const repExplicit = sys.repRowName ? rows.find((r) => r.name.includes(sys.repRowName)) : null;
  const repPool = repExplicit ? [repExplicit] : (pool.length ? pool : rows);
  for (const row of repPool) {
    const r = evalRow(row, current, panel0, cfg, evalCtx);
    if (r.crit > repVal) { repVal = r.crit; repRow = row; }
  }
  const repType = repRow ? rowAttackType(repRow) : null; // 代表行攻击方式：bonus 子键匹配用
  // 逐武器重组面板 + 被动注入 + 代表行暴击
  const evalPanel = (x, fxArr) => {
    const a90 = stat.atk + x.a;
    const atkPct = (x.s && x.s[0] === 'atk%' ? x.s[1] / 100 : 0) + fxSumArr(fxArr, 'atk%') / 100 + ascPct;
    return {
      atk: a90 * (1 + atkPct) + C_atk, hp: P.hp, def: P.def,
      cr: Math.min(100, Math.max(0, 5 + ascCr + (x.s && x.s[0] === 'cr' ? x.s[1] : 0) + fxSumArr(fxArr, 'cr') + C_cr)),
      cd: Math.max(0, 50 + ascCd + (x.s && x.s[0] === 'cd' ? x.s[1] : 0) + fxSumArr(fxArr, 'cd') + C_cd),
      em: Math.max(0, ascEm + (x.s && x.s[0] === 'em' ? x.s[1] : 0) + fxSumArr(fxArr, 'em') + C_em),
    };
  };
  const SUB_ZH = { 'atk%': '攻击力%', cr: '暴击率', cd: '暴击伤害', em: '元素精通', er: '充能效率', phys: '物理伤害', 'hp%': '生命值%', 'def%': '防御力%' };
  const FX_ZH = { 'atk%': '攻击力', cr: '暴击率', cd: '暴击伤害', em: '元素精通', er: '充能效率', 'hp%': '生命值', 'def%': '防御力', 'star': '星反应增伤', 'bonus.all': '全伤害', 'bonus.normal': '普攻伤害', 'bonus.charge': '重击伤害', 'bonus.skill': '战技伤害', 'bonus.burst': '爆发伤害' };
  const bars = cand.map(([id, x]) => {
    let bestCrit = -1, bestPanel = null;
    for (const wf of fxWindows(x)) { // 轮转类逐窗口枚举（互斥激活），非轮转武器单窗口
      const panel1 = evalPanel(x, wf);
      const wCfg = { ...cfg, dmgBonus: cfg.dmgBonus + fxSumArr(wf, 'bonus', repType), starBonus: cfg.starBonus + fxSumArr(wf, 'star') / 100 };
      const r = evalRow(repRow, current, panel1, wCfg, evalCtx);
      if (r.crit > bestCrit) { bestCrit = r.crit; bestPanel = panel1; }
    }
    const subZh = x.s ? (x.s[0] === 'em' ? `精通 ${x.s[1]}` : `${SUB_ZH[x.s[0]] || x.s[0]} ${x.s[1]}%`) : '无副词条';
    const fxList = (x.fx || []).map((f) => {
      const dot = f.k.indexOf('.');
      const base = dot < 0 ? f.k : f.k.slice(0, dot);
      const nm = FX_ZH[base] || f.k;
      const w = !f.w ? '（常驻）' : f.w.startsWith('lun') ? `（轮转第 ${f.w.slice(3)} 段）` : '（条件触发）';
      return `${nm}+${f.v}%${w}`;
    }).join('、') || '未计入（复杂被动）';
    const tip = [
      `${x.n}（${x.r}★ ${x.t} · 白值 ${x.a} · 副词条 ${subZh}）`,
      `代表行：${repRow.rowName} 暴击 ${fmtN(bestCrit)}`,
      `  面板攻击 = 白字 ${stat.atk} + 武器 ${x.a} + 圣遗物 ${Math.round(bestPanel.atk - stat.atk - x.a)} = ${fmtN(bestPanel.atk)}`,
      `  暴击 ${bestPanel.cr}% / 爆伤 ${bestPanel.cd}% / 精通 ${Math.round(bestPanel.em)}（圣遗物反推，换武器不变）`,
      `  被动：${fxList}`,
    ].join('\n');
    return { id, name: x.n, rank: x.r, crit: Math.round(bestCrit), isCur: id === curId, hasFx: !!x.fx, tip };
  }).sort((a, b) => b.crit - a.crit || b.id - a.id);
  window.GS_WEAPON_BARS = bars;

  // 绘制：横向条形 top12 + 当前武器强制保留
  const wrapNow = document.getElementById('weaponChartWrap');
  hint.hidden = true;
  wrapNow.style.display = '';
  const cv = document.getElementById('weaponChart');
  const dpr = devicePixelRatio || 1;
  const W = 760, H = 320;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.height = H + 'px';
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);
  const top = bars.slice(0, 12);
  const cur = bars.find((b) => b.isCur);
  if (cur && !top.includes(cur)) top.push(cur);
  const maxV = Math.max(...top.map((b) => b.crit));
  weaponBarRects = []; // 每次重绘重建命中区域
  const padL = 116, padR = 78, rowH = (H - 26) / top.length;
  c2.font = '11px sans-serif';

  top.forEach((b, i) => {
    const y = 16 + i * rowH + rowH * 0.15;
    const h = rowH * 0.7;
    const w = Math.max(2, (b.crit / maxV) * (W - padL - padR));
    c2.fillStyle = b.isCur ? '#d3bc8e' : '#5cc8a8';
    c2.fillRect(padL, y, w, h);
    c2.fillStyle = b.isCur ? '#d3bc8e' : '#d8dee9';
    c2.fillText(b.name.slice(0, 9), 6, y + h - 2);
    c2.fillText(b.crit.toLocaleString(), padL + w + 4, y + h - 2);
    weaponBarRects.push({ x: padL, y, w: W - padL - padR, h, tip: b.tip });
  });
  const notDrawn = bars.length - top.length;
  document.getElementById('weaponNote').textContent =
    `代表行：${repRow.rowName}（暴击值）· 被动按常驻/激活口径 · 反推面板：攻 ${Math.round(evalPanel(curW, curFxBase).atk)} / 暴 ${evalPanel(curW, curFxBase).cr}% / 伤 ${evalPanel(curW, curFxBase).cd}% / 精 ${Math.round(evalPanel(curW, curFxBase).em)}` +
    (notDrawn > 0 ? ` · 其余 ${notDrawn} 把未绘出` : '') +
    (usingDefault ? ` · 面板来源：${p.source}（登录拉取你的面板后自动切换）` : '');
}

// ===== 伤害计算（标准公式）=====
// 倍率基数（面板属性）× 技能倍率 × (1+加成) × 暴击区 × 增幅区 × 防御区 × 抗性区
function calcRow(basePanel, multPct, cfg, amplifyMult) {
  const base = basePanel * multPct;
  const defMult = (cfg.charLv + 100) / ((cfg.charLv + 100) + (cfg.enemyLv + 100));
  const resMult = cfg.enemyRes >= 0 ? 1 - cfg.enemyRes : 1 - cfg.enemyRes / 2; // enemyRes 已是百分数/100 的小数
  const white = base * (1 + cfg.dmgBonus / 100) * defMult * resMult * amplifyMult;
  const crit = white * (1 + cfg.critDmg / 100);
  const expect = white * (1 + (cfg.critRate / 100) * (cfg.critDmg / 100));
  return { white, crit, expect };
}

// 星系反应直伤行（星超导/星扩散，如"递变聚爆星超导伤害|倍率元素精通"、"棱晶弹星超导伤害|倍率"）：
// 强度研究院（gensri.wiki）口径：伤害 = 面板属性×倍率 × 反应系数 × 精通乘区 × 暴击区 × 抗性区。
// · 倍率基数：标签带"元素精通"后缀用精通面板（米提亚），否则用攻击面板（七七/桑多涅/奥黛塔等，倍率数值已反推吻合）。
// · 反应系数：由极星辉域记录次数决定——0 次=1.00、1 次=1.45、每多一次 +0.05、12 次封顶 2.00；星扩散恒为 1。
// · 精通乘区沿用月曜公式：1 + 6×元素精通÷(元素精通+2000)。
// · 不吃普通元素增伤、防御、蒸发/融化增幅；可以暴击。
// · 固有天赋"星耀祝礼"的 14% 基础提升不计入（gensri 公式含此项，但两次游戏内实测都不支持：
//   桑多涅 9785、薇斯纳 81428 均在不乘 1.14 时闭合，故以实测为准）。
// · 属性转精通类固有天赋（桑多涅「淑女的行事准则」、菲林斯「幽焰的呢喃」）：米游社面板不含，见 MULT_SYSTEM.emTalent 统一补入。
// ===== 月曜/星曜乘区体系配置表（gensri 口径；新角色在此加一行配置即可，不逐角色打补丁）=====
// lunarMult：月乘区（月感电 3.0 / 月结晶 1.62 / 月绽放 1.0）；boost：月兆/星耀祝赐基础提升（per100 = 每 100 点属性提升 %，封顶 cap%）
// emTalent：属性转精通类固有天赋（每 100 点属性 + per100 点精通，封顶 cap 点）——米游社面板不含，计算时补入
// manzhui：月兆·满辉状态加成（菲林斯满辉下月感电伤害 +20%，按激活口径）；concerto：莉奈娅 C2 月笼协奏（#87/#88 实测反推）
const MULT_SYSTEM = {
  Zibai:     { lunarMult: 1.62, boost: { stat: 'def', per100: 0.7, cap: 14, talent: '月兆祝赐·浮明若流' } },
  Linnea:    { lunarMult: 1.62, boost: { stat: 'def', per100: 0.7, cap: 14, talent: '月兆祝赐·栖地考察' }, concerto: 1.767 },
  Flins:     { lunarMult: 3.0, boost: { stat: 'atk', per100: 0.7, cap: 14, talent: '月兆祝赐·旧世潜藏' }, emTalent: { per100: 8, cap: 160, talent: '幽焰的呢喃' }, manzhui: 20 },
  Ineffa:    { lunarMult: 3.0, boost: { stat: 'atk', per100: 0.7, cap: 14, talent: '月兆祝赐·象拟中继' } },
  Columbina: { lunarMult: 1.62, boost: { stat: 'hp', per100: 0.02, cap: 7, talent: '月兆祝赐·借汝月光' } }, // 每 1000 生命 +0.2%
  Lauma:     { lunarMult: 1.0, boost: { stat: 'em', per100: 1.75, cap: 14, talent: '月兆祝赐·千籁恩宠' } }, // 每点精通 +0.0175%
  Nefer:     { lunarMult: 1.0, boost: { stat: 'em', per100: 1.75, cap: 14, talent: '月兆祝赐·廊下暮影' } },
  Sandrone:  { boost: { stat: 'atk', per100: 0.7, cap: 14, talent: '星耀祝礼·唯理为光' }, emTalent: { per100: 8, cap: 160, talent: '淑女的行事准则' }, repRowName: '重击冷凝射线星超导' }, // 主输出：重击循环触发星超导（实测 #28 口径）
  Odette:    { boost: { stat: 'atk', per100: 0.7, cap: 14, talent: '星耀祝礼·银晓之舞' } },
  Vesna:     { boost: { stat: 'atk', per100: 0.7, cap: 14, talent: '星耀祝礼·散华序饰' } },
  Mitya:     { boost: { stat: 'em', per100: 2.8, cap: 14, talent: '星耀祝礼·极密协议' } }, // 每点精通 +0.028%
};
const systemOf = (cur) => MULT_SYSTEM[cur.name] || {};
// 属性转精通补入值（桑多涅/菲林斯：米游社面板不含该天赋加成）
const emBonusOf = (cur, panel) => {
  const t = systemOf(cur).emTalent;
  if (!t) return 0;
  return Math.min((panel.atk / 100) * t.per100, t.cap);
};
// 月兆/星耀祝赐基础提升乘区（总面板属性口径，封顶 cap%）
const boostMultOf = (cur, panel) => {
  const b = systemOf(cur).boost;
  if (!b) return 1;
  const statV = b.stat === 'def' ? panel.def : b.stat === 'atk' ? panel.atk : b.stat === 'hp' ? panel.hp : panel.em;
  return 1 + Math.min((statV / 100) * b.per100, b.cap) / 100;
};
// 星系反应伤害行的判定（入表前已过滤为纯伤害行，无需再排增益说明）
const isStarRow = (l) => /星超导|星扩散/.test(l.name);
// emEff：实际精通（桑多涅为面板精通+天赋「淑女的行事准则」加成，其余角色=面板精通）
function calcStarRow(basePanel, multPct, cfg, coeff, emEff) {
  // 精通乘区 = 1 + 精通项 + 附加精通乘区："星反应伤害提升X%"类buff加进本乘区（gensri实测口径，
  // 网易替换圣遗物测试 570→454 比值 1.256≠1.4 证明非独立乘算）
  const em = emEff === undefined ? cfg.em : emEff;
  const emZone = 1 + (6 * em) / (em + 2000) + cfg.starBonus;
  const resMult = cfg.enemyRes >= 0 ? 1 - cfg.enemyRes : 1 - cfg.enemyRes / 2; // enemyRes 已是百分数/100 的小数
  const white = basePanel * multPct * coeff * emZone * resMult;
  const crit = white * (1 + cfg.critDmg / 100);
  const expect = white * (1 + (cfg.critRate / 100) * (cfg.critDmg / 100));
  return { white, crit, expect };
}
const fmtN = (v) => v >= 10000 ? Math.round(v).toLocaleString() : v.toFixed(1);

// ===== 输入快照：从伤害计算输入区收集 cfg 与派生量（calcAll 与武器收益图共用）=====
function buildCfg() {
  const g = (id) => parseFloat(document.getElementById(id).value) || 0;
  const cfg = {
    charLv: g('c_charlv'), enemyLv: g('c_enelev'), enemyRes: g('c_res') / 100,
    critRate: g('c_cr'), critDmg: g('c_cd'), dmgBonus: g('c_bonus'), starBonus: g('c_starbonus') / 100,
    em: g('c_em'), scaling: document.getElementById('c_scaling').value,
    tlv: Math.min(15, Math.max(1, Math.round(g('c_tlv')))),
    atk: g('c_atk'), hp: g('c_hp'), def: g('c_def'),
  };
  // 增幅系数：无增幅 = 1（乘法恒等）；有增幅时叠精通加成（蒸发/融化 2.78×元素精通÷(元素精通+1400)），
  // 精通增幅基于当前 em 计算（武器收益图传重组面板 em 时自然联动）
  const amplifyMult = parseFloat(document.getElementById('c_amplify').value) || 1;
  // 星系反应系数：极星辉域记录次数 0~12（0 次=1.00、1 次=1.45、每多一次 +0.05、12 次封顶 2.00）
  const records = Math.min(12, Math.max(0, Math.round(g('c_records'))));
  const starCoeff = records === 0 ? 1 : Math.min(1.45 + 0.05 * (records - 1), 2);
  // 薇斯纳整肃（仪典·春之行列）：拥有整肃时召唤的灵剑造成 100%+层数×10% 的伤害，至多 6 层；
  // 施放战技或退场时清空——打桩循环满层时按实际层数填
  const zhengsu = Math.min(6, Math.max(0, Math.round(g('c_zhengsu'))));
  const fulight = Math.max(70, Math.round(parseFloat((document.getElementById('c_fulight') || {}).value) || 70));
  return { cfg, amplifyMult, records, starCoeff, zhengsu, zhengsuBoost: 1 + 0.1 * zhengsu, fulight };
}

// ===== 行集合：从天赋 JSON 推导伤害行（与面板输入无关；倍率按 tlv 索引）=====
// 计算表仅保留伤害行：名称含"伤害/射击"且非增益说明（排除持续时间/冷却时间/体力消耗/元素能量/治疗量及"伤害增加/提升"类行）；
// "虚影"为已知特例（奈芙尔幻戏虚影一/二/三段，以元素精通为基数的直伤行）
function buildRows(cur, tlv) {
  const rows = [];
  for (const key of ['combat1', 'combat2', 'combat3']) {
    const t = cur.talents?.[key];
    if (!t) continue;
    const lines = (t.labels || []).map((raw) => {
      const matches = [...raw.matchAll(/\{param(\d+)(?::(\w+))?\}/g)];
      const parts = raw.split('|');
      return { name: parts[0], suffix: parts.slice(1).join('').replace(/\{param[^}]*\}/g, '').trim(),
               num: matches.length ? +matches[0][1] : 0 };
    }).filter((l) => l.num > 0 && /伤害|射击|虚影/.test(l.name) && !/增加|提升|百分比/.test(l.name));
    const starAny = lines.some(isStarRow);
    for (const l of lines) {
      const multPct = (t.params['param' + l.num] || [])[tlv - 1];
      if (multPct === undefined) continue;
      rows.push({
        key, tname: t.name, starAny,
        name: l.name, suffix: l.suffix,
        rowName: l.name + (l.suffix ? '（' + l.suffix + '）' : ''),
        multPct,
        emScaled: l.suffix.includes('精通'), suffixDef: l.suffix.includes('防御力'), suffixHp: l.suffix.includes('生命'),
        isStar: isStarRow(l),
        // 行分类：月曜角色（MULT_SYSTEM.lunarMult）的"月感电/月结晶/月绽放"行 + 显式登记行 → 月曜直伤公式
        isLunar: (systemOf(cur).lunarMult && /月感电|月结晶|月绽放/.test(l.name))
          || (cur.name === 'Zibai' && l.name.includes('灵驹飞踏第二段'))
          || (cur.name === 'Linnea' && key === 'combat2'), // 莉奈娅露米战技（行名不含月关键词，按 combat2 显式登记）
        isZibaiLunar: cur.name === 'Zibai', // 兹白专属加段（太阴降/二命）与六命浮光
        isLinneaLunar: cur.name === 'Linnea', // 莉奈娅：C2 月笼协奏乘区（实测反推）
        isLingjian: cur.name === 'Vesna' && key === 'combat3', // 薇斯纳大招召唤的灵剑（吃整肃加成）
      });
    }
  }
  return rows;
}

// ===== 纯计算：给定行身份与面板，产出三数值（无 DOM 依赖；武器收益图逐武器重算复用）=====
// panel: {atk, hp, def, cr, cd, em}——render 路径=输入框值；武器图路径=按武器重组后的面板
// ctx: buildCfg 的返回 + cons（命座数）
function evalRow(row, cur, panel, cfg, ctx) {
  const rc = { ...cfg, atk: panel.atk, hp: panel.hp, def: panel.def, critRate: panel.cr, critDmg: panel.cd, em: panel.em };
  const resMult = rc.enemyRes >= 0 ? 1 - rc.enemyRes : 1 - rc.enemyRes / 2;
  let mult = row.multPct;
  if (row.isLunar) {
    // 月曜直伤（gensri 口径），不吃防御乘区：面板属性×倍率段×基础提升(月兆祝赐口径)×月乘区(按月曜类型)×月曜精通乘区×抗性×(1+满辉)
    const sys = systemOf(cur);
    if (cur.name === 'Zibai') {
      mult += 0.6; // 太阴降 60% 防御力（兹白固有天赋）
      if (ctx.cons >= 2) mult += 5.5; // 二命 550% 防御力
    }
    const attrV = sys.boost ? panel[sys.boost.stat] : panel.def; // 倍率基数属性 = 基础提升口径属性（兹白/莉奈娅防御、菲林斯攻击）
    const emEff = rc.em + emBonusOf(cur, panel); // 属性转精通天赋（幽焰的呢喃等）米游社面板不含，补入
    let white = attrV * mult * boostMultOf(cur, panel) * sys.lunarMult * (1 + (6 * emEff) / (emEff + 2000)) * resMult;
    if (cur.name === 'Zibai' && ctx.cons >= 6) white *= 1 + 0.016 * (ctx.fulight - 70); // 六命：溢出浮光每点擢升 1.6%
    if (sys.manzhui) white *= 1 + sys.manzhui / 100; // 月兆·满辉激活口径（菲林斯月感电伤害 +20%）
    if (sys.concerto) white *= sys.concerto; // 莉奈娅 C2 月笼协奏（#87/#88 实测反推，待 gensri 确认精确机制）
    let critDmg = rc.critDmg;
    if (cur.name === 'Linnea' && ctx.cons >= 2 && row.name.includes('百万吨重锤')) critDmg += 150; // C2：露米的百万吨重锤额外提高 150% 暴击伤害
    return { white, crit: white * (1 + critDmg / 100), expect: white * (1 + (rc.critRate / 100) * (critDmg / 100)) };
  }
  if (row.isStar) {
    // 桑多涅星系行用的实际精通 = 面板精通 + 固有天赋「淑女的行事准则」（米游社面板不含该天赋加成）
    const emStar = rc.em + emBonusOf(cur, panel);
    const coeff = /星超导/.test(row.name) ? ctx.starCoeff : 1;
    let r = calcStarRow(row.emScaled ? emStar : panel.atk, mult, rc, coeff, emStar);
    if (row.isLingjian && ctx.zhengsu > 0) {
      // 薇斯纳大招灵剑吃整肃加成（仪典·春之行列，独立乘区）
      r = { white: r.white * ctx.zhengsuBoost, crit: r.crit * ctx.zhengsuBoost, expect: r.expect * ctx.zhengsuBoost };
    }
    return r;
  }
  // 标准直伤：增幅精通加成基于当前 em（武器图重组面板时自然联动）
  const amplBonus = ctx.amplifyMult > 1 ? 1 + (2.78 * rc.em) / (rc.em + 1400) : 1;
  const rowPanel = row.emScaled ? rc.em : row.suffixDef ? panel.def : row.suffixHp ? panel.hp
    : ({ atk: panel.atk, hp: panel.hp, def: panel.def }[cfg.scaling] || panel.atk);
  let r = calcRow(rowPanel, mult, rc, ctx.amplifyMult * amplBonus);
  if (row.isLingjian && ctx.zhengsu > 0) {
    // 灵剑伤害行同样吃整肃（#75 实测：罗莎莉亚大招→薇斯纳直接大招，灵剑伤害 5961.8×忠忱4.001×整肃1.1 = 26239 闭合）
    r = { white: r.white * ctx.zhengsuBoost, crit: r.crit * ctx.zhengsuBoost, expect: r.expect * ctx.zhengsuBoost };
  }
  return r;
}

// 伤害计算折叠区：输入变化实时重算
function calcAll() {
  const box = document.getElementById('calcOut');
  if (!current) return;
  const ctx = buildCfg();
  const cfg = ctx.cfg;
  const cons = (window.hoyoPanelForPage || {}).constellation || 0;
  const panel = { atk: cfg.atk, hp: cfg.hp, def: cfg.def, cr: cfg.critRate, cd: cfg.critDmg, em: cfg.em };
  const rows = buildRows(current, cfg.tlv);

  box.innerHTML = '';
  let charHasStar = false;
  let charHasLunar = false; // 含月曜直伤行（灵驹飞踏第二段等）
  const groups = [...new Set(rows.map((r) => r.key))];
  for (const key of groups) {
    const rowGroup = rows.filter((r) => r.key === key);
    const starAny = rowGroup[0].starAny;
    const sec = document.createElement('section');
    sec.className = 'card';
    const h3 = document.createElement('h3');
    h3.textContent = rowGroup[0].tname + `（天赋 Lv ${cfg.tlv}${starAny ? ' · 含星系反应伤害' : ''}）`;
    sec.appendChild(h3);
    const table = document.createElement('table');
    const head = '<thead><tr><th>属性</th><th>无暴击</th><th>暴击</th><th>期望</th></tr></thead>';
    let html = head + '<tbody>';
    // 悬停浮窗：每行组装一份"完整乘区来源"文本，挂到该行所有单元格（任意伤害数字可查）
    const pct1 = (v) => (v * 100).toFixed(1) + '%';
    const resMultVal = cfg.enemyRes >= 0 ? 1 - cfg.enemyRes : 1 - cfg.enemyRes / 2;
    const critLine = (rv) => `暴击 ${fmtN(rv.crit)} = 白字 × (1 + 爆伤 ${cfg.critDmg}%)\n期望 ${fmtN(rv.expect)} = 白字 × (1 + 暴击率 ${cfg.critRate}% × 爆伤 ${cfg.critDmg}%)`;
    const tips = [];
    for (const row of rowGroup) {
      const r = evalRow(row, current, panel, cfg, { ...ctx, cons });
      if (row.isStar) charHasStar = true;
      if (row.isLunar) charHasLunar = true;
      const rowName = row.rowName;
      const panelZh = row.emScaled ? '元素精通' : row.suffixDef ? '防御力' : row.suffixHp ? '生命值上限'
        : { atk: '攻击力', hp: '生命值上限', def: '防御力' }[cfg.scaling];
      // 命座与状态规则登记（逐条模式，效果原文参考公开资料；命座数取米游社/Enka 缓存）：
      // 兹白灵驹飞踏第二段为月结晶技能（月曜直伤，gensri 口径），不吃防御乘区——太阴降 60%/二命 550% 为倍率加段；
      // 一命 ×3.2 仅切换月转时隙后初次施放生效，默认不计（2026-11-12 打桩实测闭合）；月乘区取 1.62（实测裁决）
      let tip;
      if (row.isLunar) {
        const sys = systemOf(current);
        const isZb = current.name === `Zibai`;
        let mult = row.multPct + (isZb ? 0.6 + (cons >= 2 ? 5.5 : 0) : 0); // 兹白：太阴降 60% + 二命 550%
        let lunarNotes = ``;
        if (isZb && cons >= 1) lunarNotes += `  一命 ×3.2 未计入：仅切换月转时隙后初次施放生效
`;
        if (isZb && cons >= 6) lunarNotes += `  × 六命浮光 ${(1 + 0.016 * (ctx.fulight - 70)).toFixed(4)}（消耗浮光 ${ctx.fulight}，超出 70 点部分每点 +1.6%）
`;
        const lunarTypeZh = sys.lunarMult >= 3 ? `月感电` : sys.lunarMult >= 1.6 ? `月结晶` : `月绽放`;
        tip = [
          `${rowName}（天赋 Lv ${cfg.tlv} · 月曜直伤（${lunarTypeZh}），不吃防御区）`,
          `无暴击 ${fmtN(r.white)} = 面板${isZb ? `防御力` : `面板属性`} ${fmtN(panel[sys.boost.stat])} × 倍率段 ${pct1(mult)}`,
          isZb ? `  倍率段 = 基础 ${pct1(row.multPct)} + 太阴降 60.0%（固有天赋）${cons >= 2 ? ` + 二命 550%` : ``}` : `  倍率 ${pct1(row.multPct)}（露米重锤）`,
          `  × 基础提升 ${boostMultOf(current, panel).toFixed(4)}（「${sys.boost.talent}」每 100 ${sys.boost.stat === `def` ? `防御力` : sys.boost.stat === `atk` ? `攻击力` : sys.boost.stat === `hp` ? `生命值上限` : `元素精通`} +${sys.boost.per100}%，封顶 ${sys.boost.cap}%）`,
          `  × 月乘区 ${sys.lunarMult.toFixed(2)}（${lunarTypeZh}）`,
          `  × 月曜精通乘区 ${(1 + (6 * (cfg.em + emBonusOf(current, panel))) / ((cfg.em + emBonusOf(current, panel)) + 2000)).toFixed(4)}（精通 ${cfg.em + emBonusOf(current, panel)}${emBonusOf(current, panel) > 0 ? `，含属性转精通天赋` : ``}）`,
          sys.manzhui ? `  × 满辉 ${(1 + sys.manzhui / 100).toFixed(2)}（月兆·满辉，月感电伤害 +${sys.manzhui}%）` : null,
          sys.concerto ? `  × 月笼协奏 ${sys.concerto}（C2 满辉下月结晶立即触发月笼协奏；#87/#88 实测反推，待 gensri 确认）` : null,
          `  × 抗性区 ${resMultVal.toFixed(4)}（敌抗 ${cfg.enemyRes * 100}%）`,
          lunarNotes + critLine(r),
        ].filter(Boolean).join(`
`);
      } else if (row.isStar) {
        const emStar = cfg.em + emBonusOf(current, panel); // 米游社面板不含属性转精通天赋，按配置表补入
        const emTalent = systemOf(current).emTalent;
        const coeff = /星超导/.test(row.name) ? ctx.starCoeff : 1;
        const emBonus = emStar - cfg.em;
        const emBase = emBonus > 0
          ? `${emStar.toFixed(1)} = 米游社面板 ${cfg.em} + 固有天赋「${(emTalent || {}).talent || '属性转精通'}」+${emBonus.toFixed(1)}（每 100 攻击力 +8 精通，攻击力 ${fmtN(panel.atk)} → +${(panel.atk / 100 * 8).toFixed(1)}，上限 160）`
          : String(cfg.em);
        tip = [
          `${rowName}（天赋 Lv ${cfg.tlv} · ${/星扩散/.test(row.name) ? '星扩散直伤' : '星超导直伤'}，不吃防御与普通增伤）`,
          `无暴击 ${fmtN(r.white)} = 面板${panelZh} ${fmtN(row.emScaled ? emStar : panel.atk)} × 倍率 ${pct1(row.multPct)}`,
          coeff > 1 ? `  × 反应系数 ${coeff.toFixed(2)}（极星辉域记录 ${ctx.records} 次）`
            : `  × 反应系数 1.00（${/星扩散/.test(row.name) ? '星扩散恒为 1' : '极星辉域记录 0 次'}）`,
          `  × 精通乘区 ${(1 + (6 * emStar) / (emStar + 2000) + cfg.starBonus).toFixed(4)}（精通 ${emBase}${cfg.starBonus ? ` + 星反应增伤 ${(cfg.starBonus * 100).toFixed(1)}%` : ''}）`,
          row.isLingjian && ctx.zhengsu > 0 ? `  × 整肃 ${ctx.zhengsuBoost.toFixed(2)}（${ctx.zhengsu} 层，灵剑伤害每层 +10%，仪典·春之行列）` : null,
          `  × 抗性区 ${resMultVal.toFixed(4)}（敌抗 ${cfg.enemyRes * 100}%）`,
          critLine(r),
        ].filter(Boolean).join('\n');
      } else {
        const amplBonus = ctx.amplifyMult > 1 ? 1 + (2.78 * cfg.em) / (cfg.em + 1400) : 1;
        const amplTotal = ctx.amplifyMult * amplBonus;
        const rowPanel = row.emScaled ? cfg.em : row.suffixDef ? panel.def : row.suffixHp ? panel.hp
          : ({ atk: cfg.atk, hp: cfg.hp, def: cfg.def }[cfg.scaling] || cfg.atk);
        const amplZh = ctx.amplifyMult > 1
          ? `增幅区 ${amplTotal.toFixed(4)}（${document.getElementById('c_amplify').selectedOptions[0].text} × 精通增幅 ${amplBonus.toFixed(4)}）`
          : '增幅区 1.00（无蒸发/融化）';
        tip = [
          `${rowName}（天赋 Lv ${cfg.tlv} · 标准直伤）`,
          `无暴击 ${fmtN(r.white)} = 面板${panelZh} ${fmtN(rowPanel)} × 倍率 ${pct1(row.multPct)}`,
          `  × 增伤区 ${(1 + cfg.dmgBonus / 100).toFixed(4)}（元素伤害加成 ${cfg.dmgBonus}%）`,
          `  × ${amplZh}`,
          `  × 防御区 ${((cfg.charLv + 100) / ((cfg.charLv + 100) + (cfg.enemyLv + 100))).toFixed(4)}（Lv${cfg.charLv} 打 Lv${cfg.enemyLv}）`,
          row.isLingjian && ctx.zhengsu > 0 ? `  × 整肃 ${ctx.zhengsuBoost.toFixed(2)}（${ctx.zhengsu} 层，灵剑伤害每层 +10%，仪典·春之行列）` : null,
          `  × 抗性区 ${resMultVal.toFixed(4)}（敌抗 ${cfg.enemyRes * 100}%）`,
          critLine(r),
        ].filter(Boolean).join('\n');
      }
      tips.push(tip);
      html += `<tr><td>${rowName}</td>` +
        `<td class="num">${fmtN(r.white)}</td><td class="num">${fmtN(r.crit)}</td><td class="num">${fmtN(r.expect)}</td></tr>`;
    }
    html += '</tbody>';
    table.innerHTML = html;
    table.querySelectorAll('tbody tr').forEach((tr, i) => {
      if (tips[i] === undefined) return;
      [...tr.cells].forEach((td) => { td.dataset.tip = tips[i]; });
    });
    sec.appendChild(table);
    box.appendChild(sec);
  }
  // 公式说明跟随角色伤害类型：含星系行的角色显示星系公式，含月曜直伤行的角色附加月曜说明，其余显示标准公式
  document.getElementById('calcMeta').innerHTML = charHasStar
    ? '星超导/星扩散直伤 = 属性×倍率 × 反应系数 × 精通乘区（1+6×元素精通÷(元素精通+2000)+星反应增伤）× 暴击区 × 抗性区，不吃防御、普通增伤与蒸发/融化增幅；"星反应伤害提升X%"类buff计入精通乘区而非独立乘算；反应系数由极星辉域记录次数决定（0 次=1.00 → 12 次=2.00），星扩散恒为 1。固有天赋「淑女的行事准则」的精通加成（桑多涅）已自动计入。'
    : charHasLunar
    ? '公式：伤害 = 属性×倍率 × (1+加成) × 暴击区 × 增幅区 × 防御区 × 抗性区。精通增幅（蒸发/融化）= 2.78×元素精通÷(元素精通+1400)。增幅反应仅作用于元素伤害。灵驹飞踏第二段为月结晶技能，按月曜直伤公式：防御×倍率段（含太阴降60%）× 基础提升（月兆祝赐，封顶14%）× 月乘区 1.62 × 月曜精通乘区 × 抗性区，不吃防御区；一命220%仅切换月转时隙后初次施放生效（默认不计）、六命浮光擢升为独立乘区。'
    : '公式：伤害 = 属性×倍率 × (1+加成) × 暴击区 × 增幅区 × 防御区 × 抗性区。精通增幅（蒸发/融化）= 2.78×元素精通÷(元素精通+1400)。增幅反应仅作用于元素伤害。';
}

// 输入持久化：面板/敌人参数存 localStorage（跨角色共用一套试验台参数），进页面自动恢复
const CFG_KEY = 'genshin_calc_inputs';
function saveCalcInputs() {
  const data = {};
  document.querySelectorAll('.calc-grid input, .calc-grid select').forEach((el) => { data[el.id] = el.value; });
  try { localStorage.setItem(CFG_KEY, JSON.stringify(data)); } catch (_) { /* 隐私模式等存不进：静默 */ }
}
let calcInputsRestored = false; // 上次输入存档恢复过 = 用户来过，默认参考面板不再覆盖其手填值
function restoreCalcInputs() {
  try {
    const data = JSON.parse(localStorage.getItem(CFG_KEY));
    if (!data) return;
    calcInputsRestored = true;
    Object.entries(data).forEach(([id, v]) => {
      const el = document.getElementById(id);
      if (el) el.value = v;
    });
  } catch (_) { /* 无存档或解析失败：保持默认值 */ }
}
// 输入联动（实时重算）
function bindCalcInputs() {
  restoreCalcInputs(); // 首算前恢复上次输入
  // 战斗参数（敌人/天赋/反应/星系状态）同时联动武器收益图
  ['c_charlv','c_enelev','c_res','c_bonus','c_tlv','c_records','c_starbonus','c_fulight','c_zhengsu'].forEach((id) => {
    document.getElementById(id).addEventListener('input', () => { calcAll(); drawWeaponCompare(); });
  });
  // 面板四维与暴击/精通仅联动伤害计算表——武器收益图固定按米游社缓存反推（图注已说明），防"手改面板后图与表不一致"
  ['c_cr','c_cd','c_em','c_atk','c_hp','c_def'].forEach((id) => {
    document.getElementById(id).addEventListener('input', calcAll);
  });
  document.getElementById('c_scaling').addEventListener('change', () => { calcAll(); drawWeaponCompare(); });
  document.getElementById('c_amplify').addEventListener('change', () => { calcAll(); drawWeaponCompare(); });
  const grid = document.querySelector('.calc-grid'); // 事件委托统一存档，覆盖输入框与下拉框
  grid.addEventListener('input', saveCalcInputs);
  grid.addEventListener('change', saveCalcInputs);
}
// ===== 米游社面板：登录入口在主页（index.html），此处读取 localStorage 缓存自动填充本角色 =====
const HOYO_KEY = 'genshin_hoyo_panels';
const hoyoStatus = (t) => {
  const el = document.getElementById('hoyo_status');
  el.textContent = t;
  el.hidden = false;
};

// 缓存中取当前角色面板并覆盖填充面板输入；返回缓存时间字符串，无缓存返回 ''
window.hoyoPanelForPage = null; // 当前角色的米游社面板数据（含命座数），供命座规则等计算逻辑读取
function hoyoFillPanel() {
  try {
    const cache = JSON.parse(localStorage.getItem(HOYO_KEY) || 'null');
    if (!cache || !cache.chars || !window.GS_PAGE_NAME) return '';
    const p = cache.chars[window.GS_PAGE_NAME];
    if (!p) { window.hoyoPanelForPage = null; return ''; }
    window.hoyoPanelForPage = p; // 供命座规则等计算逻辑读取（含 constellation 字段）
    const setv = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
    setv('c_atk', p.atk); setv('c_hp', p.hp); setv('c_def', p.def);
    setv('c_cr', p.cr); setv('c_cd', p.cd); setv('c_em', p.em); setv('c_bonus', p.bonus);
    setv('c_charlv', p.level);
    calcAll(); saveCalcInputs();
    return cache.time +
      (p.constellation !== undefined ? ' · ' + (window.GS_PAGE_NAME || '') + ' ' + p.constellation + '命' : '') +
      (p.weapon ? ' · ' + p.weapon + (p.affix ? ' 精炼' + p.affix : '') : '');
  } catch { return ''; }
}

bindCalcInputs();

// 伤害数字来源浮窗：悬停显示、左键点击锁定（保持显示并可选中文本复制），点空白处或 Esc 解锁
const tipBox = document.createElement('div');
tipBox.id = 'calcTip';
document.body.appendChild(tipBox);
const calcOut = document.getElementById('calcOut');
let tipLocked = false;
const placeTip = (e) => {
  const pad = 14, r = tipBox.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad; // 右边界翻转
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad; // 下边界翻转
  tipBox.style.left = x + 'px';
  tipBox.style.top = y + 'px';
};
const unlockTip = () => {
  tipLocked = false;
  tipBox.style.pointerEvents = 'none';
  tipBox.style.borderColor = '#2c3850';
  tipBox.style.display = 'none';
};
const lockTip = (text, e) => {
  tipLocked = true;
  tipBox.textContent = text;
  tipBox.style.display = 'block';
  tipBox.style.pointerEvents = 'auto'; // 锁定后可选中复制
  tipBox.style.borderColor = '#d3bc8e';
  const bar = document.createElement('div');
  bar.style.cssText = 'margin-top:6px;padding-top:6px;border-top:1px solid #2c3850;display:flex;gap:10px;align-items:center;';
  const btn = document.createElement('button');
  btn.textContent = '复制全文';
  btn.style.cssText = 'background:#2c3850;color:#d3bc8e;border:1px solid #3c4a66;border-radius:4px;padding:2px 10px;font-size:12px;cursor:pointer;';
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '已复制';
    } catch {
      btn.textContent = '复制失败，请手动选择文字';
    }
    setTimeout(() => { btn.textContent = '复制全文'; }, 1500);
  });
  const hint = document.createElement('span');
  hint.textContent = '点击空白处或按 Esc 关闭';
  hint.style.cssText = 'color:#9aa7bd;font-size:11.5px;';
  bar.append(btn, hint);
  tipBox.appendChild(bar);
  placeTip(e);
};
calcOut.addEventListener('mouseover', (e) => {
  if (tipLocked) return; // 锁定中悬停不更新
  const td = e.target.closest('td[data-tip]');
  if (!td) { tipBox.style.display = 'none'; return; }
  tipBox.textContent = td.dataset.tip;
  tipBox.style.display = 'block';
  placeTip(e);
});
calcOut.addEventListener('mousemove', (e) => { if (!tipLocked && tipBox.style.display === 'block') placeTip(e); });
calcOut.addEventListener('mouseleave', () => { if (!tipLocked) tipBox.style.display = 'none'; });
calcOut.addEventListener('click', (e) => {
  const td = e.target.closest('td[data-tip]');
  if (!td) return;
  lockTip(td.dataset.tip, e);
});
document.addEventListener('click', (e) => {
  if (!tipLocked) return;
  if (tipBox.contains(e.target)) return; // 浮窗内点击（复制按钮）不解锁
  if (e.target.closest && e.target.closest('td[data-tip]')) return; // 点击另一数字：切换锁定目标
  unlockTip();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') unlockTip(); });

// 武器收益图条形：悬停显示该武器伤害来源（命中检测），点击锁定同技能表浮窗
const wcv = document.getElementById('weaponChart');
const hitBar = (e) => {
  const r = wcv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (760 / r.width), my = (e.clientY - r.top) * (320 / r.height);
  return weaponBarRects.find((b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) || null;
};
wcv.addEventListener('mousemove', (e) => {
  if (tipLocked) return;
  const hit = hitBar(e);
  if (!hit) { tipBox.style.display = 'none'; return; }
  tipBox.textContent = hit.tip;
  tipBox.style.display = 'block';
  placeTip(e);
});
wcv.addEventListener('mouseleave', () => { if (!tipLocked) tipBox.style.display = 'none'; });
wcv.addEventListener('click', (e) => {
  const hit = hitBar(e);
  if (!hit) return;
  e.stopPropagation(); // 不冒泡到 document（否则 canvas 点击被当作空白点击而解锁）
  lockTip(hit.tip, e);
});
// 武器库并行拉取（weaponsReady.then 触发武器收益图，见 boot 链路）
// 默认参考面板填充（未登录访客）：实测去零头/典型配装合成值填入右列输入
function fillDefaultPanel(cur) {
  const dp = makeDefaultPanel(cur);
  if (!dp) return '';
  const setv = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined && v !== null) el.value = v; };
  setv('c_atk', dp.atk); setv('c_hp', dp.hp); setv('c_def', dp.def);
  setv('c_cr', dp.cr); setv('c_cd', dp.cd); setv('c_em', dp.em);
  return dp.source;
}
boot().then(() => {
  calcAll();
  const t = hoyoFillPanel(); // 米游社缓存优先于上次手填输入（在 restoreCalcInputs 之后执行，体现"直接调用"）
  if (t) hoyoStatus('已自动填入米游社面板（' + t + '，登录入口在主页）');
  weaponsReady.then(() => {
    if (!t && !calcInputsRestored) { // 未登录且首次访问：默认参考面板填入右列（老用户保留上次手填值）
      const s = fillDefaultPanel(current);
      if (s) hoyoStatus('当前为' + s + '——在首页登录拉取你的面板后自动切换');
      calcAll();
    }
    drawWeaponCompare(); // 面板来源就绪后出图（按面板来源反推，不随面板输入变化）
  });
});
</script>
